volumes:
  minidm_db:
  minidm_keys:

services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - minidm_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${IMAGE:-registry.digitalocean.com/your-registry/minidm:latest}
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      SECURE_COOKIES: "true"
      OAUTH2_ISSUER: ${OAUTH2_ISSUER}
      OAUTH2_KEY_PATH: /app/keys/oauth2_signing.key
    volumes:
      # RSA signing key — auto-generated on first run and persisted across restarts.
      - minidm_keys:/app/keys
    depends_on:
      db:
        condition: service_healthy
