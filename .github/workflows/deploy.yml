# Builds minIDM on every push to main, pushes to the in-cluster container registry,
# and rolls out the updated deployment on DOKS.
#
# Required GitHub secrets:
#   DIGITALOCEAN_ACCESS_TOKEN  — DO personal access token (for kubeconfig)
#   CLUSTER_NAME               — DOKS cluster name (e.g. "minidm-cluster")
#   REGISTRY_HOST              — in-cluster registry hostname (e.g. "registry.jjones.dev")
#   REGISTRY_USERNAME          — htpasswd registry username
#   REGISTRY_PASSWORD          — htpasswd registry password

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build, push, rollout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push app image
        run: |
          docker build \
            -t ${{ secrets.REGISTRY_HOST }}/minidm:${{ github.sha }} \
            -t ${{ secrets.REGISTRY_HOST }}/minidm:latest \
            .
          docker push ${{ secrets.REGISTRY_HOST }}/minidm:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_HOST }}/minidm:latest

      - name: Build and push migrator image
        run: |
          docker build \
            --target migrator \
            -t ${{ secrets.REGISTRY_HOST }}/minidm-migrate:${{ github.sha }} \
            -t ${{ secrets.REGISTRY_HOST }}/minidm-migrate:latest \
            .
          docker push ${{ secrets.REGISTRY_HOST }}/minidm-migrate:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_HOST }}/minidm-migrate:latest

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Update kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.CLUSTER_NAME }}

      - name: Run migrations
        run: |
          MIGRATE_IMAGE=${{ secrets.REGISTRY_HOST }}/minidm-migrate:${{ github.sha }}
          kubectl delete job minidm-migrate --ignore-not-found
          sed "s|image: .*minidm-migrate.*|image: $MIGRATE_IMAGE|" k8s/migrate-job.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete job/minidm-migrate --timeout=180s

      - name: Print migration logs
        if: always()
        run: kubectl logs -l job-name=minidm-migrate --tail=100

      - name: Deploy to cluster
        run: |
          IMAGE=${{ secrets.REGISTRY_HOST }}/minidm:${{ github.sha }}
          kubectl set image deployment/minidm minidm=$IMAGE
          kubectl rollout status deployment/minidm --timeout=120s

      - name: Rollback on failure
        if: failure()
        run: kubectl rollout undo deployment/minidm
