# ── Secrets ───────────────────────────────────────────────────────────────────
#
# Run k8s/secrets.example.sh (with real values) before the first deploy.
# Never commit real secrets to git.

---
# ── minIDM Deployment ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minidm
  labels:
    app: minidm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minidm
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: minidm
    spec:
      imagePullSecrets:
        - name: registry-credentials
      volumes:
        - name: oauth2-key
          secret:
            secretName: minidm-oauth2-key

      containers:
        - name: minidm
          image: registry.jjones.dev/minidm:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: minidm-db-app   # manually created, points at the shared apps-postgres managed DB
                  key: uri
            - name: SECURE_COOKIES
              value: "true"
            - name: OAUTH2_ISSUER
              valueFrom:
                secretKeyRef:
                  name: minidm-secrets
                  key: oauth2-issuer
            - name: OAUTH2_KEY_PATH
              value: /app/keys/oauth2_signing.key
          volumeMounts:
            - name: oauth2-key
              mountPath: /app/keys
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---
# ── minIDM Service ────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: minidm
spec:
  selector:
    app: minidm
  ports:
    - port: 80
      targetPort: 8080

---
# ── Traefik: HTTP → HTTPS redirect middleware ─────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
# ── Traefik: HTTP IngressRoute (redirect only) ────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minidm-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`auth.jjones.dev`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: minidm
          port: 80

---
# ── Traefik: HTTPS IngressRoute ───────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minidm-https
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.jjones.dev`)
      kind: Rule
      services:
        - name: minidm
          port: 80
  tls:
    certResolver: letsencrypt
