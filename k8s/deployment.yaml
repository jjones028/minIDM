# ── Secrets ───────────────────────────────────────────────────────────────────
#
# Run k8s/secrets.example.sh (with real values) before the first deploy.
# Never commit real secrets to git.

---
# ── minIDM Deployment ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minidm
  labels:
    app: minidm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minidm
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: minidm
    spec:
      volumes:
        - name: oauth2-key
          secret:
            secretName: minidm-oauth2-key

      containers:
        - name: minidm
          image: registry.digitalocean.com/YOUR_REGISTRY/minidm:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: minidm-secrets
                  key: database-url
            - name: SECURE_COOKIES
              value: "true"
            - name: OAUTH2_ISSUER
              valueFrom:
                secretKeyRef:
                  name: minidm-secrets
                  key: oauth2-issuer
            - name: OAUTH2_KEY_PATH
              value: /app/keys/oauth2_signing.key
          volumeMounts:
            - name: oauth2-key
              mountPath: /app/keys
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

---
# ── minIDM Service ────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: minidm
spec:
  selector:
    app: minidm
  ports:
    - port: 80
      targetPort: 8080

---
# ── Postgres StatefulSet ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: minidm
            - name: POSTGRES_USER
              value: minidm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minidm-secrets
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "minidm", "-d", "minidm"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

---
# ── Postgres Service ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None

---
# ── Traefik: HTTP → HTTPS redirect middleware ─────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
# ── Traefik: HTTP IngressRoute (redirect only) ────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minidm-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`auth.yourdomain.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: minidm
          port: 80

---
# ── Traefik: HTTPS IngressRoute ───────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minidm-https
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.yourdomain.com`)
      kind: Rule
      services:
        - name: minidm
          port: 80
  tls:
    certResolver: letsencrypt
