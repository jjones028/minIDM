# ── Secrets ───────────────────────────────────────────────────────────────────
#
# Run k8s/secrets.example.sh (with real values) before the first deploy.
# Never commit real secrets to git.

---
# ── minIDM Deployment ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minidm
  labels:
    app: minidm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minidm
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: minidm
    spec:
      imagePullSecrets:
        - name: registry-credentials
      volumes:
        - name: oauth2-key
          secret:
            secretName: minidm-oauth2-key

      containers:
        - name: minidm
          image: registry.jjones.dev/minidm:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: minidm-pg-app   # generated by CloudNativePG
                  key: uri
            - name: SECURE_COOKIES
              value: "true"
            - name: OAUTH2_ISSUER
              valueFrom:
                secretKeyRef:
                  name: minidm-secrets
                  key: oauth2-issuer
            - name: OAUTH2_KEY_PATH
              value: /app/keys/oauth2_signing.key
          volumeMounts:
            - name: oauth2-key
              mountPath: /app/keys
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---
# ── minIDM Service ────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: minidm
spec:
  selector:
    app: minidm
  ports:
    - port: 80
      targetPort: 8080

---
# ── CloudNativePG Cluster ─────────────────────────────────────────────────────
# Requires the CNPG operator — see DEPLOY.md step 4b.
# CNPG auto-generates secrets: minidm-pg-app (app user) and minidm-pg-superuser.
# Services created: minidm-pg-rw (primary), minidm-pg-ro (replicas), minidm-pg-r (all).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: minidm-pg
spec:
  instances: 1   # increase to 2+ for HA with streaming replication

  bootstrap:
    initdb:
      database: minidm
      owner: minidm

  storage:
    size: 5Gi

  # ── Optional: backup to DigitalOcean Spaces ──────────────────────────────────
  # Create the cnpg-spaces-credentials secret first (see DEPLOY.md step 4b),
  # then uncomment this block and re-apply.
  #
  # backup:
  #   barmanObjectStore:
  #     destinationPath: s3://your-backup-bucket/cnpg/
  #     endpointURL: https://nyc3.digitaloceanspaces.com
  #     s3Credentials:
  #       accessKeyId:
  #         name: cnpg-spaces-credentials
  #         key: access-key
  #       secretAccessKey:
  #         name: cnpg-spaces-credentials
  #         key: secret-key
  #     wal:
  #       compression: gzip
  #     data:
  #       compression: gzip
  #   retentionPolicy: "30d"

---
# ── Daily scheduled backup ────────────────────────────────────────────────────
# Uncomment once the backup block above is configured.
#
# apiVersion: postgresql.cnpg.io/v1
