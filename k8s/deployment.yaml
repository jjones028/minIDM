# metadata:
#   name: minidm-pg-daily
# spec:
#   schedule: "0 2 * * *"   # 02:00 UTC daily
#   backupOwnerReference: self
#   cluster:
#     name: minidm-pg

---
# ── Traefik: HTTP → HTTPS redirect middleware ─────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
# ── Traefik: HTTP IngressRoute (redirect only) ────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minidm-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`auth.jjones.dev`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: minidm
          port: 80

---
# ── Traefik: HTTPS IngressRoute ───────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minidm-https
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.jjones.dev`)
      kind: Rule
      services:
        - name: minidm
          port: 80
  tls:
    certResolver: letsencrypt
