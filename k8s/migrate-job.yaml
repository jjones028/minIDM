# Run DB migrations as a one-off Kubernetes Job.
# Trigger the "Migrate" GitHub Actions workflow manually from the Actions tab.

apiVersion: batch/v1
kind: Job
metadata:
  name: minidm-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: migrate
          image: registry.jjones.dev/minidm-migrate:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: minidm-secrets
                  key: database-url
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
